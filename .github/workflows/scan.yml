name: Morning scan

on:
  schedule:
    # GitHub often starts scheduled jobs late, so try three times early in the morning.
    # Whichever runs first does the scan; the others see it's done and stop.
    - cron: "23 8 * * *"    # 4:23 AM New York (EDT) / 3:23 AM (EST)
    - cron: "23 9 * * *"    # 5:23 AM / 4:23 AM
    - cron: "23 10 * * *"   # 6:23 AM / 5:23 AM
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's scan already happened"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Already done today?
        id: check
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          LAST=$(python3 -c "import json;print(json.load(open('jobs.json')).get('lastRun',{}).get('date',''))")
          if [ "$LAST" = "$TODAY" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Today's scan already ran ($TODAY)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Refresh job feeds
        if: steps.check.outputs.skip == 'false'
        run: python watch/watch.py

      - name: Load roles already applied to (tracker + site marks)
        if: steps.check.outputs.skip == 'false'
        env:
          SB_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key = "".join((os.environ.get("SB_KEY") or "").split())
          if not key:
              print("::notice title=Applied list::No SUPABASE_SECRET_KEY secret; skipping."); raise SystemExit
          base = "https://xsrmswbbakfqfvpdxtjo.supabase.co/rest/v1/"
          h = {"apikey": key}
          if key.startswith("eyJ"): h["Authorization"] = "Bearer " + key
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=h), timeout=30) as r:
                  return json.loads(r.read())
          out = {"tracker": get("tracker_rows?select=company,role,status"),
                 "site_marks": get("job_marks?select=company,title,status")}
          json.dump(out, open("scan/applied.json", "w"), indent=1)
          print(len(out["tracker"]), "tracker rows,", len(out["site_marks"]), "site marks")
          print(f"::notice title=Applied list::{len(out['tracker'])} tracker rows, {len(out['site_marks'])} site marks")
          PY

      - name: Clean up the token (removes stray line breaks from copy/paste)
        if: steps.check.outputs.skip == 'false'
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CLEAN=$(printf '%s' "$RAW" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          echo "CLEAN_TOKEN=$CLEAN" >> "$GITHUB_ENV"

      - name: Pick today's jobs with Claude
        id: claude
        if: steps.check.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLEAN_TOKEN }}
          github_token: ${{ github.token }}   # no Claude GitHub App needed
          prompt: |
            Today is ${{ steps.check.outputs.today }} (America/New_York).
            Read scan/PROMPT.md and follow it exactly.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python3:*)"

      - name: Write today's brief with Claude
        id: brief
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLEAN_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Today is ${{ steps.check.outputs.today }} (America/New_York).
            Read scan/NEWS.md and follow it exactly.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,WebSearch,WebFetch,Bash(python3:*)"

      - name: Check and save
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 -c "import json;d=json.load(open('jobs.json'));print('jobs:',len(d['jobs']),'browse:',len(d.get('browse',[])),'|',d['lastRun'])"
          python3 -c "import json;n=json.load(open('news.json'));print('brief:',n['date'],len(n['items']),'items |',n['learn']['term'])" || git checkout -- news.json
          git config user.name "daily-jobs-scan"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json news.json watch/seen.json watch/candidates.json watch/report.json watch/browse.json
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "Daily scan ${{ steps.check.outputs.today }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done

      - name: Save the error if Claude failed
        if: failure() && steps.claude.outcome == 'failure'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python3 - <<'PY'
          import json, os
          path = os.environ.get("EXEC_FILE") or ""
          msg = "No execution file was produced."
          if path and os.path.exists(path):
              try:
                  data = json.load(open(path))
                  items = data if isinstance(data, list) else [data]
                  res = [m for m in items if isinstance(m, dict) and m.get("type") == "result"]
                  last = res[-1] if res else items[-1]
                  msg = json.dumps({k: last.get(k) for k in ("subtype", "is_error", "result", "num_turns")}, indent=1)[:2000]
              except Exception as e:
                  msg = f"Couldn't read execution file: {e}"
          open("scan/last-error.txt", "w").write(msg + "\n")
          print(msg)
          one = " ".join(msg.split())[:900].replace("%", "%25")
          print(f"::warning title=Claude result::{one}")
          PY
          git config user.name "daily-jobs-scan"
          git config user.email "actions@users.noreply.github.com"
          git add scan/last-error.txt
          git commit -m "Morning scan error $(date -u +%F)" && git pull --rebase -q origin main && git push -q origin main || true
